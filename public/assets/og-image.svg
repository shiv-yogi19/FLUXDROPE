<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og_bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090e"/>
      <stop offset="0.5" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="og_flux_grad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="og_glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og_bg)"/>
  <circle cx="600" cy="240" r="380" fill="url(#og_glow)"/>

  <!-- Logo -->
  <g transform="translate(540, 100)">
    <path d="M60 14L102 56L60 106L18 56L60 14Z" stroke="url(#og_flux_grad)" stroke-width="5" fill="rgba(56, 189, 248, 0.12)"/>
    <path d="M38 56C42 44 52 44 60 56C68 68 78 68 82 56" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="60" cy="56" r="7" fill="#38bdf8"/>
    <circle cx="60" cy="56" r="3" fill="#ffffff"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">FLUXDROPE</text>
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">Created By Shiv Yogi</text>
  <text x="600" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">Liquid Glass High-Performance Peer-to-Peer File Transfer with WebRTC DataChannel</text>

  <!-- Feature Pills -->
  <g transform="translate(320, 500)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="80" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">WebRTC P2P</text>

    <rect x="180" y="0" width="200" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="280" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">7-Attempt Lockout</text>

    <rect x="400" y="0" width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="480" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">14 Glass Layouts</text>
  </g>
</svg>
