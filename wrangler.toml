name = "fluxdrope"
main = "src/worker/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "TRANSFER_SESSIONS", class_name = "TransferSessionDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["TransferSessionDO"]
