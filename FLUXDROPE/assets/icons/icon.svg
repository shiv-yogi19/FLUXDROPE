<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e2238" stroke-width="6" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="2" stroke-dasharray="10 12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" />

  <!-- Central Shield / Drop Hexagon -->
  <g filter="url(#glow)">
    <!-- Upward Transmission Arc -->
    <path d="M 170 230 C 170 160, 256 120, 256 120 C 256 120, 342 160, 342 230 C 342 290, 290 340, 256 370 C 222 340, 170 290, 170 230 Z" 
          fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Lightning Drop -->
    <path d="M 256 170 L 230 250 L 265 250 L 245 320 L 290 240 L 255 240 Z"
          fill="url(#neonViolet)" />
  </g>

  <!-- Peer Dots -->
  <circle cx="160" cy="180" r="10" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="352" cy="180" r="10" fill="#a855f7" filter="url(#glow)" />
  <circle cx="256" cy="400" r="8" fill="#4facfe" />
</svg>
