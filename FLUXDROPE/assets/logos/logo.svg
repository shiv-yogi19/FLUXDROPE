<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="FLUXDROPE Logo">
  <defs>
    <!-- Background Ambient Glow Filter -->
    <filter id="fd-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="fd-inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Outer Hexagon Gradient -->
    <linearGradient id="fd-hex-border" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="1" />
    </linearGradient>

    <!-- Crystal Body Radial Gradient -->
    <radialGradient id="fd-crystal-bg" cx="100" cy="80" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#060814" stop-opacity="0.98" />
    </radialGradient>

    <!-- Facet Refraction Gradients -->
    <linearGradient id="fd-facet-top" x1="100" y1="25" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="fd-facet-right" x1="165" y1="62" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="fd-facet-bottom" x1="100" y1="175" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="fd-facet-left" x1="35" y1="62" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="fd-glass-glint" x1="45" y1="35" x2="155" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Monogram 'F' Gradient -->
    <linearGradient id="fd-glyph-f" x1="60" y1="50" x2="115" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Monogram 'D' / Flux Wave Gradient -->
    <linearGradient id="fd-glyph-d" x1="95" y1="65" x2="145" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Quantum Flux Core Sphere Gradient -->
    <radialGradient id="fd-core-orb" cx="100" cy="100" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Glow Aura -->
  <polygon points="100,16 174,58 174,142 100,184 26,142 26,58"
           fill="none" stroke="url(#fd-hex-border)" stroke-width="6" opacity="0.3" filter="url(#fd-glow)" />

  <!-- Crystal Body Hexagon -->
  <polygon points="100,18 172,59 172,141 100,182 28,141 28,59"
           fill="url(#fd-crystal-bg)" stroke="url(#fd-hex-border)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Crystalline Facets -->
  <!-- Top Facet -->
  <polygon points="100,18 172,59 100,100" fill="url(#fd-facet-top)" />
  <!-- Right Facet -->
  <polygon points="172,59 172,141 100,100" fill="url(#fd-facet-right)" />
  <!-- Bottom Right Facet -->
  <polygon points="172,141 100,182 100,100" fill="url(#fd-facet-bottom)" opacity="0.8" />
  <!-- Bottom Left Facet -->
  <polygon points="100,182 28,141 100,100" fill="url(#fd-facet-bottom)" opacity="0.6" />
  <!-- Left Facet -->
  <polygon points="28,141 28,59 100,100" fill="url(#fd-facet-left)" />
  <!-- Top Left Facet -->
  <polygon points="28,59 100,18 100,100" fill="url(#fd-facet-top)" opacity="0.8" />

  <!-- Hexagonal Inner Glass Frame -->
  <polygon points="100,32 158,65 158,135 100,168 42,135 42,65"
           fill="none" stroke="url(#fd-glass-glint)" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.65" />

  <!-- Center Monogram: Integrated "FD" & Flux Stream -->
  <g filter="url(#fd-inner-shadow)">
    <!-- Glyph 'F' Component: Vertical Spine & Crossbars -->
    <path d="M 64 54 
             C 64 50 67 48 71 48 
             L 104 48 
             C 107 48 109 50 109 53 
             C 109 56 107 58 104 58 
             L 76 58 
             L 76 82 
             L 98 82 
             C 101 82 103 84 103 87 
             C 103 90 101 92 98 92 
             L 76 92 
             L 76 144 
             C 76 148 73 151 69 151 
             C 65 151 64 148 64 144 
             Z" 
          fill="url(#fd-glyph-f)" />

    <!-- Glyph 'D' Component / Flux Wave Arc -->
    <!-- Flows dynamically from central axis, curving gracefully into a secure cyber-shield bow -->
    <path d="M 100 58 
             C 118 58 136 68 143 83 
             C 149 94 149 106 143 117 
             C 136 132 118 142 100 142 
             C 96 142 93 139 93 135 
             C 93 131 96 128 100 128 
             C 113 128 126 120 131 109 
             C 135 102 135 96 131 89 
             C 126 80 113 72 100 72 
             C 96 72 93 69 93 65 
             C 93 61 96 58 100 58 
             Z" 
          fill="url(#fd-glyph-d)" />

    <!-- Quantum Flux Drop Stream (Center Arrow / Drop Transition) -->
    <path d="M 98 95 
             L 112 108 
             L 104 108 
             L 104 126 
             L 94 126 
             L 94 108 
             L 86 108 
             Z" 
          fill="url(#fd-glyph-f)" opacity="0.9" />

    <!-- Micro Quantum Sparkle Nodes -->
    <circle cx="100" cy="100" r="16" fill="url(#fd-core-orb)" />
    <circle cx="100" cy="18" r="3" fill="#00f0ff" />
    <circle cx="172" cy="59" r="3" fill="#8b5cf6" />
    <circle cx="172" cy="141" r="3" fill="#d946ef" />
    <circle cx="100" cy="182" r="3" fill="#3b82f6" />
    <circle cx="28" cy="141" r="3" fill="#00f0ff" />
    <circle cx="28" cy="59" r="3" fill="#38bdf8" />
  </g>

  <!-- Top-left Edge Specular Glint Reflection -->
  <path d="M 33 60 L 98 22 C 99 22 100 22 101 22 L 40 57 Z" fill="#ffffff" opacity="0.55" />
</svg>
