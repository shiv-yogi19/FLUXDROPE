<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none" role="img" aria-label="FLUXDROPE Favicon">
  <defs>
    <!-- Favicon Hexagon Background Gradient -->
    <linearGradient id="fd-fav-bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="fd-fav-ring" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="fd-fav-glyph" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Boundary Base -->
  <polygon points="16,1.5 29.5,9.5 29.5,22.5 16,30.5 2.5,22.5 2.5,9.5"
           fill="url(#fd-fav-bg)" stroke="url(#fd-fav-ring)" stroke-width="2" stroke-linejoin="round" />

  <!-- Bold Simplified FD Monogram -->
  <!-- Stem & F arms -->
  <path d="M 8.5 7.5 H 17.5 C 18.6 7.5 19.5 8.4 19.5 9.5 C 19.5 10.6 18.6 11.5 17.5 11.5 H 12 V 13.5 H 16 C 17.1 13.5 18 14.4 18 15.5 C 18 16.6 17.1 17.5 16 17.5 H 12 V 24.5 C 12 25.3 11.3 26 10.5 26 C 9.7 26 9 25.3 9 24.5 V 8 C 9 7.7 9.2 7.5 9.5 7.5 Z"
        fill="url(#fd-fav-glyph)" />

  <!-- D Arc and Flux Drop -->
  <path d="M 16 9.5 C 20.7 9.5 24.5 12.4 24.5 16 C 24.5 19.6 20.7 22.5 16 22.5 C 15.2 22.5 14.5 21.8 14.5 21 C 14.5 20.2 15.2 19.5 16 19.5 C 18.8 19.5 21.5 17.8 21.5 16 C 21.5 14.2 18.8 12.5 16 12.5 C 15.2 12.5 14.5 11.8 14.5 11 C 14.5 10.2 15.2 9.5 16 9.5 Z"
        fill="#38bdf8" />

  <!-- Center Quantum Node -->
  <circle cx="16" cy="16" r="2" fill="#ffffff" />
</svg>
